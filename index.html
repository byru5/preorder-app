<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-Order F&amp;B</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pandan:#1F5136; --pandan-2:#2E6B4A; --leaf:#E4EEDF;
  --paper:#F7F8F4; --card:#FFFFFF; --ink:#1B1E1A; --muted:#5F665C; --line:#DADFD5;
  --sambal:#C8321F; --kunyit:#E7A82A;
  --r-lg:20px; --r-sm:10px;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--paper);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);font-size:16px;line-height:1.5}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--kunyit);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 120px}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:800;font-size:1.05rem;color:var(--pandan);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar > span:last-child{white-space:nowrap}
.link{background:none;border:0;color:var(--pandan);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.back{background:none;border:0;font-weight:600;padding:6px 0;color:var(--pandan);display:inline-flex;gap:6px;align-items:center}

/* buttons & inputs */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--pandan);color:#fff}
.btn:hover{background:var(--pandan-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pandan);box-shadow:inset 0 0 0 2px var(--pandan)}
.btn.danger{background:transparent;color:var(--sambal);box-shadow:inset 0 0 0 2px var(--sambal)}
.btn.small{padding:8px 14px;font-size:.9rem}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=datetime-local],input[type=date],select,textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pandan);outline:none}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.err{color:var(--sambal);font-weight:600;font-size:.92rem;min-height:1.4em;margin-top:10px}

/* gate */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.gate h1{font-size:2.4rem;line-height:1.05;letter-spacing:-.03em;margin:0 0 10px;color:var(--pandan)}
.gate p{color:var(--muted);margin:0 0 22px}
.code-input{font-size:1.6rem!important;letter-spacing:.3em;text-align:center;font-weight:700}
.pw{position:relative}
.pw input{padding-right:52px!important}
.pw .code-input{padding-left:52px!important}
.pw .eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0}
.pw .eye:hover{color:var(--pandan);background:var(--leaf)}
.pw .eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

/* home */
.hello h1{font-size:1.9rem;line-height:1.1;letter-spacing:-.025em;margin:0 0 6px}
.hello p{color:var(--muted);margin:0 0 22px}
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.store{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.store:not(:disabled):hover{border-color:var(--pandan)}
.store .num{width:64px;height:64px;border-radius:16px;background:var(--leaf);color:var(--pandan);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem;overflow:hidden}
.store .num img{width:100%;height:100%;object-fit:cover}
.store h3{margin:0;font-size:1.08rem}
.store .meta{color:var(--muted);font-size:.88rem;margin-top:2px}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px}
.pill.open{background:var(--leaf);color:var(--pandan)}
.pill.closed{background:#EEE;color:#666}
.pill.warn{background:#FCEBD0;color:#8A5A00}
.store.is-closed{opacity:.5;cursor:not-allowed}
.store.is-first{border-color:var(--pandan);box-shadow:0 0 0 3px var(--leaf)}
.turn{font-size:.78rem;font-weight:700;color:var(--pandan)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;color:var(--muted)}

/* store page */
.store-head h1{font-size:1.8rem;letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px}
.store-head p{color:var(--muted);margin:0}
.po{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 22px}
.po div{background:var(--leaf);border-radius:var(--r-sm);padding:10px 12px}
.po small{display:block;color:var(--pandan);font-weight:600;font-size:.78rem}
.po b{font-size:.95rem}
.menus{display:flex;flex-direction:column;gap:12px}
.menu{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:row;align-items:flex-start;gap:14px;padding:12px}
.menu .ph{width:96px;height:96px;flex:none;border-radius:14px;overflow:hidden;background:var(--leaf);display:flex;align-items:center;justify-content:center;font-size:2rem}
.menu .ph img{width:100%;height:100%;object-fit:cover}
.menu button.ph{border:0;padding:0;cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(15,22,17,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox .lb{position:relative;width:min(800px,100%)}
.lightbox .lb img{display:block;width:100%;height:auto;max-height:calc(100vh - 32px);object-fit:contain;border-radius:18px}
.lightbox .lbb{padding:16px 18px 20px}
.lightbox h3{margin:0 0 4px;font-size:1.3rem;letter-spacing:-.01em}
.lightbox p{margin:0 0 10px;color:var(--muted)}
.lightbox .lv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line)}
.lightbox .lv.off{opacity:.5}
.lightbox .close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:1.4rem;font-weight:700;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.menu .body{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;min-height:96px}
.menu .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.menu h4{margin:0;font-size:1.02rem}
.menu .desc{color:var(--muted);font-size:.88rem}
.menu .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-weight:800;color:var(--pandan)}
.menu.out{opacity:.55}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vrow .vn{font-weight:600;font-size:.94rem}
.vrow .vp{color:var(--pandan);font-weight:700;font-size:.88rem}
.vrow.off{opacity:.5}
.vedit{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center;margin-top:8px}
.vedit input[type=text],.vedit input[type=number]{padding:10px}
.vedit .check{margin:0;font-size:.85rem}
.vedit .x{border:0;background:none;color:var(--sambal);font-weight:700;font-size:1.2rem;padding:4px 6px}
@media(max-width:420px){.vedit{grid-template-columns:1fr 92px}.vedit .check{grid-column:1}.vedit .x{justify-self:end}}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--pandan);background:#fff;color:var(--pandan);padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;-webkit-tap-highlight-color:transparent}
.stepper button svg{width:14px;height:14px;display:block;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none;pointer-events:none}
.stepper button.plus{background:var(--pandan);color:#fff}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.order-form{margin-top:26px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:6px 16px 18px}
.order-form h2{font-size:1.15rem;margin:12px 0 0}
.notice{background:#FCEBD0;color:#6B4600;border-radius:var(--r-sm);padding:12px 14px;font-weight:600;margin:12px 0}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--pandan);color:#fff;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.cartbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar small{opacity:.8;display:block}
.cartbar b{font-size:1.15rem}
.cartbar .btn{background:var(--kunyit);color:var(--ink)}
.head-pills{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.head-pills .pill{margin-top:0}
.kbadge{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--pandan);border-radius:999px;padding:1px 2px 1px 10px;font-size:.8rem;font-weight:700;color:var(--pandan);background:#fff;line-height:1.6}
.kbadge .kk{opacity:.75}
.kbadge .ka{letter-spacing:.02em}
.kbadge button{border:0;background:none;color:var(--pandan);width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:0}
.kbadge button:hover{background:var(--leaf)}
.kbadge svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.badge-row{display:grid;grid-template-columns:110px 1fr;gap:8px}
.po-day{display:flex;align-items:center;gap:8px;background:var(--pandan);color:#fff;border-radius:var(--r-sm);padding:10px 14px;margin:14px 0 4px;font-size:.95rem}
.recap{position:fixed;inset:0;z-index:25;background:rgba(15,22,17,.55);display:flex;align-items:flex-end;justify-content:center}
.recap .box{background:var(--paper);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.recap{align-items:center}.recap .box{border-radius:22px}}
.recap h2{margin:0 0 2px;font-size:1.3rem}
.recap .sub{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.recap .card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px}
.recap .line{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.recap .tot{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:1.05rem}
.recap .kv{font-size:.92rem;padding:2px 0}
.recap .kv span{color:var(--muted)}
.recap .actions{display:flex;gap:10px;margin-top:14px}
.recap .actions .btn{flex:1}
.btn.wa{background:#1FA855;color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.02rem}
.btn.wa:hover{background:#178a45}
.share-note{color:var(--muted);font-size:.88rem;margin:8px 0 14px}
.done{text-align:center;padding:40px 10px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--leaf);color:var(--pandan);font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.receipt{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;text-align:left;margin:20px 0}
.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.receipt .tot{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:800}

/* admin */
.tabs{display:flex;gap:6px;background:var(--leaf);padding:5px;border-radius:999px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;font-size:.92rem;white-space:nowrap;border-radius:999px;font-weight:700;color:var(--pandan)}
.tabs button.on{background:#fff;box-shadow:0 1px 2px rgba(31,81,54,.15)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h2{margin:0;font-size:1.25rem}
.alist{display:flex;flex-direction:column;gap:10px}
.aitem{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:12px;align-items:center}
.aitem .th{width:52px;height:52px;border-radius:10px;background:var(--leaf);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.aitem .th img{width:100%;height:100%;object-fit:cover}
.aitem .grow{flex:1;min-width:0}
.aitem h4{margin:0;font-size:1rem}
.aitem .meta{color:var(--muted);font-size:.85rem}
.aitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sheet{position:fixed;inset:0;background:rgba(20,30,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h2{margin:4px 0 6px}
.sched{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.sched td{padding:5px 4px;vertical-align:middle}
.sched td:first-child{font-weight:600;width:96px}
.sched input[type=time]{padding:8px 6px;min-width:0;width:100%}
.sched .off{color:var(--muted);font-size:.85rem}
.check{display:flex;gap:8px;align-items:center;font-weight:600;margin:14px 0 0}
.check input{width:20px;height:20px;accent-color:var(--pandan)}
.mode-chips{display:flex;gap:8px;flex-wrap:wrap}
.mode-chips .chip{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:700;color:var(--muted);text-align:left;line-height:1.25}
.mode-chips .chip small{display:block;font-weight:500;font-size:.76rem}
.mode-chips .chip.on{background:var(--pandan);border-color:var(--pandan);color:#fff}
.daychips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daychips label{margin:0;display:inline-flex}
.daychips input{position:absolute;opacity:0;pointer-events:none}
.daychips span{display:inline-block;min-width:42px;text-align:center;padding:7px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.daychips input:checked + span{background:var(--pandan);border-color:var(--pandan);color:#fff}
.daychips input:focus-visible + span{outline:3px solid var(--kunyit);outline-offset:2px}
.batas-row{display:flex;gap:8px;align-items:center}
.batas-row input[type=time],.batas-row input[type=datetime-local]{flex:1;min-width:0}
.filepick{display:flex;align-items:center;gap:10px;max-width:100%;min-width:0}
.filepick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.filepick label{margin:0;flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem;color:var(--pandan);box-shadow:inset 0 0 0 2px var(--pandan);background:#fff;cursor:pointer}
.filepick input[type=file]:focus-visible + label{outline:3px solid var(--kunyit);outline-offset:2px}
.filepick .fn{min-width:0;flex:1;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .box{overflow-x:hidden}
.sheet .box form{min-width:0;max-width:100%}
.foto-prev{width:100%;max-width:220px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-sm);margin-top:8px;background:var(--leaf)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.order{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.order.selesai{opacity:.6}
.order .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.order .top b{font-size:1rem}
.order .when{color:var(--muted);font-size:.82rem}
.order .items{margin:6px 0}
.order .note{background:var(--paper);border-radius:8px;padding:6px 10px;font-size:.9rem;margin:6px 0}
.order .bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters select{flex:1}
.filters input[type=date]{flex:1;min-width:0;padding:10px 12px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:700;color:var(--pandan)}
.quick button.on{background:var(--leaf);border-color:var(--pandan)}
.panel-head .btns{display:flex;gap:6px}
.rekap-text{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;white-space:pre-wrap;font-family:inherit;font-size:.92rem;line-height:1.55;max-height:50vh;overflow:auto;margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw}
.loading{color:var(--muted);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .queue li{animation:rise .35s ease both}
  .queue li:nth-child(2){animation-delay:.04s}.queue li:nth-child(3){animation-delay:.08s}.queue li:nth-child(4){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
/* ===== Konfigurasi ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxWXi3LDOOT-x1nIlx1usibbzeGRV1KR_mws8euMFdZ-d91CDzrOuWccZ4OGgs6X4avdw/exec';
const HARI = ['senin','selasa','rabu','kamis','jumat','sabtu','minggu'];
const NAMA_HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
// Nomor versi aplikasi: NAIKKAN setiap commit baru, supaya link di WhatsApp selalu memuat versi terbaru
const APP_VERSION = 13;
// Link yang dibagikan di WhatsApp: selalu alamat utama aplikasi
const SHARE_URL = 'https://byru5.github.io/preorder-app';
const shareUrl = () => SHARE_URL;

/* ===== Pembaruan otomatis =====
   GitHub Pages mengizinkan browser menyimpan salinan halaman ~10 menit.
   Saat dibuka (dan saat kembali ke tab), aplikasi mengecek versi terbaru di server tanpa cache;
   jika ada versi lebih baru, halaman dimuat ulang sendiri sehingga alamat utama selalu menampilkan versi terbaru. */
async function cekVersiBaru(){
  if (window.DEMO_API || !/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch(location.origin + location.pathname + '?cek=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = (\d+);/);
    const terbaru = m ? Number(m[1]) : 0;
    if (terbaru > APP_VERSION) {
      const sudah = Number(sess.get('po_update_ke') || 0);
      toast('Memperbarui ke versi terbaru…');
      if (sudah === terbaru) {
        // Muat ulang biasa belum cukup (cache bandel): buka alamat dengan penanda versi baru
        location.replace(location.origin + location.pathname + '?v=' + terbaru + location.hash);
      } else {
        sess.set('po_update_ke', terbaru);

async function api(action, data={}){

  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  const txt = await r.text();
  let j;
  try { j = JSON.parse(txt); }
  catch(e){
    // Kadang Google membungkus jawaban JSON di dalam halaman HTML; ambil isinya.
    try { const d = new DOMParser().parseFromString(txt, 'text/html'); d.querySelectorAll('script,style').forEach(x=>x.remove()); j = JSON.parse(d.body.textContent.trim()); }
    catch(e2){ throw new Error('Server sedang sibuk. Tunggu sebentar lalu coba lagi.'); }

let allPromise = null;
function saveAll(){ try { localStorage.setItem('po_all', JSON.stringify(ALL)); } catch(e){} }
function refreshAll(){
  if (allPromise) return allPromise;
  allPromise = api('getAll').then(d => {
    ALL = { stores: d.stores, menus: d.menus, po: d.preorder || null, at: Date.now() }; saveAll(); preloadPhotos(); return ALL;
  }).finally(() => { allPromise = null; });
  return allPromise;
}
const allFresh = (ms=30000) => ALL && Date.now() - ALL.at < ms;
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function labelPendek(iso){ if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return HARI_ID[new Date(y, m-1, d).getDay()].slice(0,3) + ', ' + d + ' ' + BLN[m-1]; }
const poOf = s => (s && s.po) || { iso: '', label: preorderLabel(), custom: false };
function labelTanggal(iso){ if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1, d); return HARI_ID[dt.getDay()] + ', ' + d + ' ' + BLN[m-1]; }
// Batas pesan berulang: "HH:MM|0,1,2" (0 = Senin ... 6 = Minggu). Format lama (tanggal-jam) tetap didukung.
const INISIAL = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
function parseBatas(v){
  if (!v) return null;
  const m = String(v).match(/^(\d{2}:\d{2})\|([\d,]*)$/);
  if (m) return { jam: m[1], hari: m[2] ? m[2].split(',').map(Number) : [] };
  return { legacy: String(v) };
}
function hariIniWIB(){ const d = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Jakarta', weekday:'short' }).format(new Date()); return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(d); }
function batasLabel(v, untukHariIni){
  const b = parseBatas(v); if (!b) return '';
  if (b.legacy) return fmtWaktu(b.legacy);
  const jam = b.jam.replace(':', '.');
  if (untukHariIni) return b.hari.includes(hariIniWIB()) ? `Hari ini pukul ${jam}` : '';
  const hari = b.hari.length === 7 ? 'setiap hari' : b.hari.map(i => INISIAL[i]).join(', ');
  return `${jam} · ${hari}`;
}
// Tanggal pre-order = hari kerja berikutnya (Jumat/Sabtu/Minggu -> Senin). Utamakan data server.
function preorderLabel(){
  if (ALL && ALL.po && ALL.po.label) return ALL.po.label;
  const t = new Date(); const add = {5:3, 6:2}[t.getDay()] || 1; t.setDate(t.getDate() + add);
  return HARI_ID[t.getDay()] + ', ' + t.getDate() + ' ' + BLN[t.getMonth()];
}
function thumb(url, w){ return url ? url.replace(/sz=w\d+/, 'sz=w' + w) : url; }
let preloaded = {};
function preloadPhotos(){
  const run = () => (ALL ? ALL.menus : []).forEach(m => { const u = thumb(m.foto_url, 600); if (u && !preloaded[u]) { preloaded[u] = 1; new Image().src = u; } });
  if (window.requestIdleCallback) requestIdleCallback(run, { timeout: 2000 }); else setTimeout(run, 300);
}
function markOrdered(storeId){
  if (!ALL) return;
  const s = ALL.stores.find(x => x.id === storeId); if (!s) return;
  s.terakhir_dipesan = '9999-12-31T23:59:59'; // sementara: paling bawah sampai data server masuk
  ALL.stores.sort((a,b) => (a.buka!==b.buka) ? (a.buka?-1:1) : ((a.terakhir_dipesan||'') < (b.terakhir_dipesan||'') ? -1 : (a.terakhir_dipesan||'') > (b.terakhir_dipesan||'') ? 1 : a.nama.localeCompare(b.nama)));
  saveAll();
}

    try { await refreshAll(); } catch(err){ if (err.message === 'Kode akses salah') return logout(); toast(err.message); return go('/'); }

    const close = () => box.remove();
    backdropClose(box, close, () => !sending);
    $('#rc-back', box).onclick = close;
    let sending = false;
    $('#rc-send', box).onclick = async () => {
      const b = $('#rc-send', box); sending = true; b.disabled = true; $('#rc-back', box).disabled = true; b.textContent = 'Mengirim…'; $('#rc-e', box).textContent = '';
      try {
        const res = await api('placeOrder', { id_toko: s.id, nama, catatan, items: lines.map(l => ({ id: l.id, varian_id: l.varian_id, qty: l.qty })) });
        store.set('po_nama', nama);
        if (res.preorder && ALL) { ALL.po = res.preorder; }
        markOrdered(s.id); refreshAll().catch(()=>{});
        close(); viewDone(s, res, nama);
      } catch(err){
        sending = false; b.disabled = false; $('#rc-back', box).disabled = false; b.textContent = 'Kirim'; $('#rc-e', box).textContent = err.message;
      }
    };
    $('#rc-send', box).focus();
  };
}

function showPhoto(m){
  if (!m || !m.foto_url) return;
  const box = document.createElement('div'); box.className = 'lightbox';
  box.innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="Foto ${esc(m.nama)}">

    <img src="${esc(thumb(m.foto_url,800))}" alt="${esc(m.nama)}">
  </div>`;
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };

  backdropClose(box, close);
  box.querySelector('.close').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(box);
  box.querySelector('.close').focus();
}

/* --- Rekap pesanan per menu (untuk disalin ke WhatsApp) --- */
function rekapText(storeId, tg){
  const orders = A.orders.filter(o => o.id_toko === storeId && orderDate(o) === tg).reverse(); // urut dari pemesan pertama
  const menus = A.menus.filter(m => m.id_toko === storeId).sort((a,b) => (Number(a.urutan)||0) - (Number(b.urutan)||0));
  const order = new Map(menus.map((m,i) => [m.id, i]));
  const groups = new Map(); let porsi = 0, total = 0;
  orders.forEach(o => {
    total += Number(o.total) || 0;
    (o.items || []).forEach(it => {
      porsi += it.qty;
      const m = menus.find(x => x.id === it.id);
      const key = it.id;
      const nama = m ? m.nama : String(it.nama).replace(/\s*\(.*\)$/, '');
      let varian = '';
      if (it.varian_id && m) varian = ((m.varian||[]).find(v => v.id === it.varian_id) || {}).nama || '';
      if (!varian) { const mm = String(it.nama).match(/\(([^)]*)\)$/); if (mm && it.varian_id) varian = mm[1]; }
      if (!groups.has(key)) groups.set(key, { nama, rows: [] });
      groups.get(key).rows.push({ pemesan: o.nama_pemesan, varian, qty: it.qty });
    });
  });
  const [y,m,d] = tg.split('-').map(Number);
  const head = `Pre-Order, ${HARI_ID[new Date(y, m-1, d).getDay()]} ${d} ${BLN[m-1]}`;
  if (!groups.size) return { text: `${head}\n\nBelum ada pesanan.`, porsi: 0, total: 0, count: 0 };
  const keys = [...groups.keys()].sort((a,b) => (order.has(a)?order.get(a):999) - (order.has(b)?order.get(b):999));
  const parts = [head, ''];
  keys.forEach(k => {
    const g = groups.get(k);
    parts.push(`*${g.nama}*`);
    g.rows.forEach((r,i) => parts.push(`${i+1}. ${[r.pemesan, r.varian].filter(Boolean).join(' - ')}${r.qty>1?` (${r.qty}x)`:''}`));
    parts.push('');
  });
  // Catatan ditulis sekali per pesanan, di bagian tersendiri
  const notes = orders.filter(o => String(o.catatan||'').trim());
  if (notes.length){
    parts.push('*Catatan*');
    notes.forEach(o => parts.push(`- ${o.nama_pemesan}: ${String(o.catatan).trim()}`));
    parts.push('');
  }
  parts.push(`Total pesanan: ${porsi} porsi · ${rp(total)}`);
  return { text: parts.join('\n'), porsi, total, count: orders.length };
}

/* --- unggah foto (dikompres di browser) --- */
function compressImage(file, max=800){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => rej(new Error('File bukan gambar yang valid'));
    img.src = url;
  });
}
async function uploadFrom(input, preview, hidden){
  const file = input.files[0]; if (!file) return;
  const fn = input.parentElement && input.parentElement.querySelector('.fn'); if (fn) fn.textContent = file.name;
  preview.classList.remove('hidden'); preview.style.opacity = .4;
  try {
    const data = await compressImage(file);
    preview.src = 'data:image/jpeg;base64,' + data;
    const r = await api(act('uploadPhoto'), { data, mimeType:'image/jpeg', name: file.name.replace(/\.[^.]+$/,'') + '.jpg' });
    hidden.value = r.url; preview.style.opacity = 1; toast('Foto terunggah');
  } catch(err){ preview.style.opacity = 1; toast('Foto gagal diunggah: ' + err.message); }
}

function openSheet(html){
  const d = document.createElement('div'); d.className = 'sheet';
  d.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  backdropClose(d, () => d.remove());
  document.body.appendChild(d);
  return d;
}

function editStore(id){
  const s = A.stores.find(x=>x.id===id) || { mode:'Otomatis' };
  const d = openSheet(`
    <h2>${id?'Ubah toko':'Tambah toko'}</h2>
    <form id="sf">
      <label for="s_nama">Nama toko</label><input id="s_nama" type="text" required value="${esc(s.nama||'')}">
      <label for="s_kode">Kode toko</label>${pwField(`<input id="s_kode" type="password" autocomplete="new-password" value="${esc(A.owner ? (sess.get('po_toko')||'') : (s.kode_toko||''))}" placeholder="Contoh: warunga88">`)}
      <p class="hint">${A.owner ? 'Kode untuk masuk ke halaman pemilik toko ini. Minimal 4 karakter dan harus berbeda dari toko lain. Setelah diganti, gunakan kode baru saat masuk berikutnya.' : 'Dipakai pemilik toko untuk masuk dan mengelola tokonya. Harus berbeda untuk setiap toko.'}</p>
      <label for="s_desk">Deskripsi singkat</label><input id="s_desk" type="text" value="${esc(s.deskripsi||'')}" placeholder="Contoh: Nasi campur dan aneka lauk">
      <label for="s_bhuruf">Badge info <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <div class="badge-row">
        <input id="s_bhuruf" type="text" maxlength="12" value="${esc(s.badge_huruf||'')}" placeholder="Huruf" aria-label="Huruf badge">
        <input id="s_bangka" type="text" inputmode="numeric" maxlength="30" value="${esc(s.badge_angka||'')}" placeholder="Angka" aria-label="Angka badge">
      </div>
      <p class="hint">Tampil di halaman toko sebagai "Huruf-Angka" dengan tombol salin untuk angkanya. Kosongkan angka jika tidak ingin ditampilkan.</p>
      <label>Foto atau logo toko <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <div class="filepick"><input id="s_file" type="file" accept="image/*"><label for="s_file">📷 Pilih foto</label><span class="fn">${s.foto_url?'Foto sudah ada':'Belum ada foto'}</span></div>
      <img id="s_prev" class="foto-prev ${s.foto_url?'':'hidden'}" src="${esc(s.foto_url||'')}" alt="">
      <input id="s_foto" type="hidden" value="${esc(s.foto_url||'')}">

      <label for="s_mode">Status terima pesanan</label>
      <select id="s_mode">
        ${['Otomatis','Paksa Buka','Paksa Tutup'].map(m=>`<option ${s.mode===m?'selected':''}>${m}</option>`).join('')}
      </select>
      <p class="hint">Otomatis mengikuti jadwal terima pesanan di bawah (WIB). Paksa Buka/Tutup mengabaikan jadwal.</p>

      ${(() => {
        const custom = s.po_mode === 'custom';
        const hariOn = HARI.map(h => !!(s[h+'_buka'] && s[h+'_tutup']));
        const first = HARI.find(h => s[h+'_buka'] && s[h+'_tutup']);
        const beda = new Set(HARI.filter(h => s[h+'_buka']).map(h => s[h+'_buka']+'-'+s[h+'_tutup'])).size > 1;
        const isNew = !id;
        return `
      <label>Tanggal pre-order</label>
      <div class="chips mode-chips" role="radiogroup" aria-label="Tanggal pre-order">
        <button type="button" class="chip ${custom?'':'on'}" data-m="besok" role="radio" aria-checked="${!custom}">Besok (otomatis)<small>Hari kerja berikutnya</small></button>
        <button type="button" class="chip ${custom?'on':''}" data-m="custom" role="radio" aria-checked="${custom}">Custom<small>Pilih tanggal</small></button>
      </div>
      <div id="po_besok" class="${custom?'hidden':''}">
        <p class="hint">Pesanan untuk hari kerja berikutnya${s.po && !s.po.custom && s.po.label ? ` (saat ini: <b>${esc(s.po.label)}</b>)` : ''}.</p>
        <label>Jadwal terima pesanan</label>
        <div class="daychips" role="group" aria-label="Hari terima pesanan">
          ${INISIAL.map((h,i) => `<label><input type="checkbox" class="jh" value="${i}" ${(isNew ? i<5 : hariOn[i])?'checked':''}><span>${h}</span></label>`).join('')}
        </div>
        <div class="batas-row" style="margin-top:8px">
          <input type="time" id="j_mulai" value="${esc(first ? s[first+'_buka'] : '06:00')}" aria-label="Jam mulai terima pesanan">
          <span style="color:var(--muted)">–</span>
          <input type="time" id="j_akhir" value="${esc(first ? s[first+'_tutup'] : '17:00')}" aria-label="Batas akhir terima pesanan">
        </div>
        <p class="hint">Mingguan: pesanan diterima tiap hari yang dipilih pada jam ini.${beda ? ' Jam sebelumnya berbeda per hari dan akan disamakan saat disimpan.' : ''}</p>
      </div>
      <div id="po_custom" class="${custom?'':'hidden'}">
        <input type="date" id="po_tgl" value="${esc((s.po_tanggal||'').slice(0,10))}" aria-label="Tanggal pre-order custom" style="margin-top:8px">
        <label>Jadwal terima pesanan (custom)</label>
        <small style="display:block;color:var(--muted);font-weight:600;margin:0 0 4px">Mulai</small>
        <input type="datetime-local" id="po_mulai" value="${esc((s.po_mulai||'').slice(0,16))}" aria-label="Mulai terima pesanan">
        <small style="display:block;color:var(--muted);font-weight:600;margin:8px 0 4px">Sampai</small>
        <input type="datetime-local" id="po_sampai" value="${esc((s.po_sampai||'').slice(0,16))}" aria-label="Batas akhir terima pesanan">
        <p class="hint">Setelah tanggal pre-order lewat, toko otomatis kembali ke mode "Besok".</p>
      </div>`; })()}

      <label for="s_ambil">Waktu pengambilan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <div class="batas-row">
        <input id="s_ambil" type="datetime-local" value="${esc((s.waktu_ambil||'').slice(0,16))}">
        <button type="button" class="btn small ghost" id="s_ambil_reset">Reset</button>
      </div>
      <div class="err" id="se"></div>
      <div class="actions">
        ${id && !A.owner?`<button type="button" class="btn danger" id="s_del">Hapus toko</button>`:''}
        <button type="button" class="btn ghost" id="s_cancel">Batal</button>
        <button class="btn" id="s_save">Simpan toko</button>
      </div>
    </form>`);
  let poMode = s.po_mode === 'custom' ? 'custom' : 'besok';
  d.querySelectorAll('.mode-chips .chip').forEach(b => b.onclick = () => {
    poMode = b.dataset.m;
    d.querySelectorAll('.mode-chips .chip').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
    $('#po_besok', d).classList.toggle('hidden', poMode !== 'besok'); $('#po_custom', d).classList.toggle('hidden', poMode !== 'custom');
  });
  bindPw(d);
  $('#s_file', d).onchange = e => uploadFrom(e.target, $('#s_prev', d), $('#s_foto', d));
  $('#s_cancel', d).onclick = () => d.remove();
  $('#s_ambil_reset', d).onclick = () => { $('#s_ambil', d).value = ''; };
  if (id && !A.owner) $('#s_del', d).onclick = async () => {
    if (!confirm(`Hapus toko "${s.nama}" beserta semua menunya? Riwayat pesanan tetap tersimpan.`)) return;
    try { await api('deleteStore', { id }); d.remove(); bersihkanCachePembeli(); toast('Toko dihapus'); A.stores = A.stores.filter(x=>x.id!==id); A.menus = A.menus.filter(x=>x.id_toko!==id); renderAdmin(); } catch(err){ $('#se', d).textContent = err.message; }
  };
  $('#sf', d).onsubmit = async e => {
    e.preventDefault();
    const o = { id: id||'', deskripsi: $('#s_desk',d).value.trim(), foto_url: $('#s_foto',d).value,
      mode: $('#s_mode',d).value, waktu_ambil: $('#s_ambil',d).value };
    o.batas_pesan = ''; // batas pesan kini menyatu dengan jadwal terima pesanan
    o.nama = $('#s_nama',d).value.trim(); o.kode_toko = $('#s_kode',d).value.trim();
    o.badge_huruf = $('#s_bhuruf',d).value.trim(); o.badge_angka = $('#s_bangka',d).value.trim();
    if (!o.nama){ $('#se',d).textContent = 'Nama toko wajib diisi.'; return; }
    if (A.owner && o.kode_toko.length < 4){ $('#se',d).textContent = 'Kode toko minimal 4 karakter.'; return; }
    let bad = '';
    o.po_mode = poMode;
    if (poMode === 'custom'){
      const tgl = $('#po_tgl',d).value, mulai = $('#po_mulai',d).value, sampai = $('#po_sampai',d).value;
      if (!tgl || !mulai || !sampai) bad = 'Lengkapi tanggal pre-order serta waktu mulai dan sampai.';
      else if (tgl <= todayWIB()) bad = 'Tanggal pre-order custom harus setelah hari ini.';
      else if (sampai <= mulai) bad = 'Waktu "Sampai" harus setelah waktu "Mulai".';
      else if (sampai.slice(0,10) > tgl) bad = 'Batas terima pesanan tidak boleh melewati tanggal pre-order.';
      o.po_tanggal = tgl; o.po_mulai = mulai; o.po_sampai = sampai;
    } else {
      const hari = [...d.querySelectorAll('.jh:checked')].map(c => Number(c.value));
      const jm = $('#j_mulai',d).value, ja = $('#j_akhir',d).value;
      if (hari.length && (!jm || !ja)) bad = 'Isi jam mulai dan batas akhir terima pesanan.';
      else if (hari.length && ja <= jm) bad = 'Batas akhir harus setelah jam mulai.';
      HARI.forEach((h,i) => { const on = hari.includes(i); o[h+'_buka'] = on ? jm : ''; o[h+'_tutup'] = on ? ja : ''; });
    }
    if (bad){ $('#se',d).textContent = bad; return; }
    const btn = $('#s_save', d); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      const r = await api(act('saveStore'), { store:o }); d.remove(); bersihkanCachePembeli();
      if (A.owner){
        const kodeBaru = o.kode_toko !== sess.get('po_toko');
        sess.set('po_toko', o.kode_toko); sess.set('po_toko_nama', o.nama);
        const br = document.querySelector('.bar .brand'); if (br) br.textContent = '🍱 ' + o.nama;
        toast(kodeBaru ? 'Toko disimpan. Kode toko baru sudah aktif.' : 'Toko disimpan');
      } else toast('Toko disimpan');
      if (r.store){ const i = A.stores.findIndex(x=>x.id===r.id); if (i>=0) A.stores[i] = r.store; else A.stores.push(r.store); renderAdmin(); }
      else loadAdmin();
    }
    catch(err){ $('#se',d).textContent = err.message; btn.disabled=false; btn.textContent='Simpan toko'; }
  };
}

function editMenu(id){
  const m = A.menus.find(x=>x.id===id) || { id_toko: A.filterToko || (A.stores[0]||{}).id, tersedia:'TRUE' };
  const d = openSheet(`
    <h2>${id?'Ubah menu':'Tambah menu'}</h2>
    <form id="mf">
      <label for="m_toko" class="${A.owner?'hidden':''}">Toko</label>
      <select id="m_toko" class="${A.owner?'hidden':''}">${A.stores.map(s=>`<option value="${esc(s.id)}" ${m.id_toko===s.id?'selected':''}>${esc(s.nama)}</option>`).join('')}</select>
      <label for="m_nama">Nama menu</label><input id="m_nama" type="text" required value="${esc(m.nama||'')}">
      <div id="m_harga_wrap"><label for="m_harga">Harga (Rp)</label><input id="m_harga" type="number" min="0" step="500" value="${esc(m.harga??'')}"></div>
      <label>Varian <span style="font-weight:400;color:var(--muted)">(opsional, misalnya ukuran atau panas/dingin)</span></label>
      <div id="m_vars"></div>
      <button type="button" class="btn small ghost" id="m_addv" style="margin-top:10px">Tambah varian</button>
      <p class="hint">Jika ada varian, setiap varian memakai harganya sendiri dan isian Harga di atas tidak dipakai.</p>
      <label for="m_desk">Deskripsi</label><textarea id="m_desk" placeholder="Contoh: Nasi, ayam goreng, sambal, lalapan">${esc(m.deskripsi||'')}</textarea>
      <label>Foto menu</label>
      <div class="filepick"><input id="m_file" type="file" accept="image/*"><label for="m_file">📷 Pilih foto</label><span class="fn">${m.foto_url?'Foto sudah ada':'Belum ada foto'}</span></div>
      <img id="m_prev" class="foto-prev ${m.foto_url?'':'hidden'}" src="${esc(m.foto_url||'')}" alt="">
      <input id="m_foto" type="hidden" value="${esc(m.foto_url||'')}">
      <label for="m_urut">Urutan tampil</label><input id="m_urut" type="number" value="${esc(m.urutan||'')}" placeholder="1, 2, 3…">
      <label class="check"><input type="checkbox" id="m_ada" ${m.tersedia!=='FALSE'?'checked':''}> Tersedia (hilangkan centang jika habis)</label>
      <div class="err" id="me"></div>
      <div class="actions">
        ${id?`<button type="button" class="btn danger" id="m_del">Hapus menu</button>`:''}
        <button type="button" class="btn ghost" id="m_cancel">Batal</button>
        <button class="btn" id="m_save">Simpan menu</button>
      </div>
    </form>`);
  $('#m_file', d).onchange = e => uploadFrom(e.target, $('#m_prev', d), $('#m_foto', d));
  $('#m_cancel', d).onclick = () => d.remove();
  const vbox = $('#m_vars', d);
  const syncHarga = () => { $('#m_harga_wrap', d).style.display = vbox.children.length ? 'none' : ''; };
  const addVar = (v={}) => {
    const row = document.createElement('div'); row.className = 'vedit'; row.dataset.id = v.id || '';
    row.innerHTML = `<input type="text" class="vn" placeholder="Nama varian, mis. Dingin" value="${esc(v.nama||'')}" aria-label="Nama varian">
      <input type="number" class="vh" min="0" step="500" placeholder="Harga" value="${esc(v.harga??'')}" aria-label="Harga varian">
      <label class="check"><input type="checkbox" class="vx" ${v.habis?'checked':''}> Habis</label>
      <button type="button" class="x" aria-label="Hapus varian">×</button>`;
    row.querySelector('.x').onclick = () => { row.remove(); syncHarga(); };
    vbox.appendChild(row); syncHarga();
    if (!v.nama) row.querySelector('.vn').focus();
  };
  (m.varian || []).forEach(addVar); syncHarga();
  $('#m_addv', d).onclick = () => addVar();
  if (id) $('#m_del', d).onclick = async () => {
    if (!confirm(`Hapus menu "${m.nama}"?`)) return;
    try { await api(act('deleteMenu'), { id }); d.remove(); bersihkanCachePembeli(); toast('Menu dihapus'); A.menus = A.menus.filter(x=>x.id!==id); renderAdmin(); } catch(err){ $('#me', d).textContent = err.message; }
  };
  $('#mf', d).onsubmit = async e => {
    e.preventDefault();
    const varian = [...vbox.querySelectorAll('.vedit')].map(r => ({ id: r.dataset.id, nama: r.querySelector('.vn').value.trim(), harga: r.querySelector('.vh').value, habis: r.querySelector('.vx').checked }));
    if (varian.some(v => !v.nama || v.harga === '')){ $('#me',d).textContent = 'Lengkapi nama dan harga setiap varian, atau hapus baris yang kosong.'; return; }
    if (!varian.length && $('#m_harga',d).value === ''){ $('#me',d).textContent = 'Isi harga menu, atau tambahkan varian beserta harganya.'; return; }
    const o = { id: id||'', id_toko: $('#m_toko',d).value, nama: $('#m_nama',d).value.trim(), harga: $('#m_harga',d).value,
      deskripsi: $('#m_desk',d).value.trim(), foto_url: $('#m_foto',d).value, urutan: $('#m_urut',d).value, tersedia: $('#m_ada',d).checked ? 'TRUE':'FALSE', varian };
    const btn = $('#m_save', d); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      const r = await api(act('saveMenu'), { menu:o }); d.remove(); bersihkanCachePembeli(); toast('Menu disimpan');
      if (r.menu){ const i = A.menus.findIndex(x=>x.id===r.id); if (i>=0) A.menus[i] = r.menu; else A.menus.push(r.menu); renderAdmin(); }
      else loadAdmin();
    }
    catch(err){ $('#me',d).textContent = err.message; btn.disabled=false; btn.textContent='Simpan menu'; }
  };
}
