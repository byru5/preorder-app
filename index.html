<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-Order Makanan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pandan:#1F5136; --pandan-2:#2E6B4A; --leaf:#E4EEDF;
  --paper:#F7F8F4; --card:#FFFFFF; --ink:#1B1E1A; --muted:#5F665C; --line:#DADFD5;
  --sambal:#C8321F; --kunyit:#E7A82A;
  --r-lg:20px; --r-sm:10px;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--paper);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);font-size:16px;line-height:1.5}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--kunyit);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 120px}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:800;font-size:1.05rem;color:var(--pandan);letter-spacing:-.01em}
.link{background:none;border:0;color:var(--pandan);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.back{background:none;border:0;font-weight:600;padding:6px 0;color:var(--pandan);display:inline-flex;gap:6px;align-items:center}

/* buttons & inputs */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;background:var(--pandan);color:#fff}
.btn:hover{background:var(--pandan-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pandan);box-shadow:inset 0 0 0 2px var(--pandan)}
.btn.danger{background:transparent;color:var(--sambal);box-shadow:inset 0 0 0 2px var(--sambal)}
.btn.small{padding:8px 14px;font-size:.9rem}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=datetime-local],select,textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pandan);outline:none}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.err{color:var(--sambal);font-weight:600;font-size:.92rem;min-height:1.4em;margin-top:10px}

/* gate */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.gate h1{font-size:2.4rem;line-height:1.05;letter-spacing:-.03em;margin:0 0 10px;color:var(--pandan)}
.gate p{color:var(--muted);margin:0 0 22px}
.code-input{font-size:1.6rem!important;letter-spacing:.3em;text-align:center;font-weight:700}

/* home */
.hello h1{font-size:1.9rem;line-height:1.1;letter-spacing:-.025em;margin:0 0 6px}
.hello p{color:var(--muted);margin:0 0 22px}
.queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.store{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.store:not(:disabled):hover{border-color:var(--pandan)}
.store .num{width:64px;height:64px;border-radius:16px;background:var(--leaf);color:var(--pandan);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem;overflow:hidden}
.store .num img{width:100%;height:100%;object-fit:cover}
.store h3{margin:0;font-size:1.08rem}
.store .meta{color:var(--muted);font-size:.88rem;margin-top:2px}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px}
.pill.open{background:var(--leaf);color:var(--pandan)}
.pill.closed{background:#EEE;color:#666}
.pill.warn{background:#FCEBD0;color:#8A5A00}
.store.is-closed{opacity:.5;cursor:not-allowed}
.store.is-first{border-color:var(--pandan);box-shadow:0 0 0 3px var(--leaf)}
.turn{font-size:.78rem;font-weight:700;color:var(--pandan)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;color:var(--muted)}

/* store page */
.store-head h1{font-size:1.8rem;letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px}
.store-head p{color:var(--muted);margin:0}
.po{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 22px}
.po div{background:var(--leaf);border-radius:var(--r-sm);padding:10px 12px}
.po small{display:block;color:var(--pandan);font-weight:600;font-size:.78rem}
.po b{font-size:.95rem}
.menus{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.menus{grid-template-columns:1fr 1fr}}
.menu{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.menu .ph{aspect-ratio:4/3;background:var(--leaf);display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.menu .ph img{width:100%;height:100%;object-fit:cover}
.menu .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.menu h4{margin:0;font-size:1.02rem}
.menu .desc{color:var(--muted);font-size:.88rem}
.menu .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-weight:800;color:var(--pandan)}
.menu.out{opacity:.55}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--pandan);background:#fff;color:var(--pandan);font-weight:800;font-size:1.1rem;line-height:1}
.stepper button.plus{background:var(--pandan);color:#fff}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.order-form{margin-top:26px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:6px 16px 18px}
.order-form h2{font-size:1.15rem;margin:12px 0 0}
.notice{background:#FCEBD0;color:#6B4600;border-radius:var(--r-sm);padding:12px 14px;font-weight:600;margin:12px 0}
.cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--pandan);color:#fff;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.cartbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar small{opacity:.8;display:block}
.cartbar b{font-size:1.15rem}
.cartbar .btn{background:var(--kunyit);color:var(--ink)}
.done{text-align:center;padding:40px 10px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--leaf);color:var(--pandan);font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.receipt{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;text-align:left;margin:20px 0}
.receipt .line{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.receipt .tot{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:800}

/* admin */
.tabs{display:flex;gap:6px;background:var(--leaf);padding:5px;border-radius:999px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:999px;font-weight:700;color:var(--pandan)}
.tabs button.on{background:#fff;box-shadow:0 1px 2px rgba(31,81,54,.15)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.panel-head h2{margin:0;font-size:1.25rem}
.alist{display:flex;flex-direction:column;gap:10px}
.aitem{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:12px;align-items:center}
.aitem .th{width:52px;height:52px;border-radius:10px;background:var(--leaf);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.aitem .th img{width:100%;height:100%;object-fit:cover}
.aitem .grow{flex:1;min-width:0}
.aitem h4{margin:0;font-size:1rem}
.aitem .meta{color:var(--muted);font-size:.85rem}
.aitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sheet{position:fixed;inset:0;background:rgba(20,30,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h2{margin:4px 0 6px}
.sched{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}
.sched td{padding:5px 4px;vertical-align:middle}
.sched td:first-child{font-weight:600;width:96px}
.sched input[type=time]{padding:8px 6px;min-width:0;width:100%}
.sched .off{color:var(--muted);font-size:.85rem}
.check{display:flex;gap:8px;align-items:center;font-weight:600;margin:14px 0 0}
.check input{width:20px;height:20px;accent-color:var(--pandan)}
.foto-prev{width:100%;max-width:220px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-sm);margin-top:8px;background:var(--leaf)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.order{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.order.selesai{opacity:.6}
.order .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.order .top b{font-size:1rem}
.order .when{color:var(--muted);font-size:.82rem}
.order .items{margin:6px 0}
.order .note{background:var(--paper);border-radius:8px;padding:6px 10px;font-size:.9rem;margin:6px 0}
.order .bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters select{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw}
.loading{color:var(--muted);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .queue li{animation:rise .35s ease both}
  .queue li:nth-child(2){animation-delay:.04s}.queue li:nth-child(3){animation-delay:.08s}.queue li:nth-child(4){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
/* ===== Konfigurasi ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxWXi3LDOOT-x1nIlx1usibbzeGRV1KR_mws8euMFdZ-d91CDzrOuWccZ4OGgs6X4avdw/exec';
const HARI = ['senin','selasa','rabu','kamis','jumat','sabtu','minggu'];
const NAMA_HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

/* ===== Util ===== */
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Number(n||0).toLocaleString('id-ID');
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
const sess = {
  get(k){ try{ return sessionStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ sessionStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k) }catch(e){} }
};
function fmtWaktu(s){
  if(!s) return '';
  const d = new Date(s.length <= 16 ? s + ':00' : s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'}) + ', ' +
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.add('hidden'), 2800);
}
async function api(action, data={}){
  const body = Object.assign({ action }, data);
  if (!('kode' in body)) body.kode = store.get('po_kode') || '';
  if (!('kodeAdmin' in body)) body.kodeAdmin = sess.get('po_admin') || '';
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}
function go(hash){ location.hash = hash; }

/* ===== Router ===== */
let refreshTimer;
function route(){
  clearInterval(refreshTimer);
  window.scrollTo(0,0);
  const h = location.hash.replace(/^#/, '') || '/';
  if (h.startsWith('/admin')) return viewAdmin();
  if (!store.get('po_kode')) return viewGate();
  if (h.startsWith('/toko/')) return viewStore(decodeURIComponent(h.slice(6)));
  return viewHome();
}
window.addEventListener('hashchange', route);

/* ===== Halaman kode akses ===== */
function viewGate(){
  app.innerHTML = `
  <main class="gate">
    <h1>Pre-order makanan</h1>
    <p>Masukkan kode akses yang dibagikan pengelola untuk mulai memesan.</p>
    <form id="f">
      <label for="kode">Kode akses</label>
      <input id="kode" class="code-input" type="password" inputmode="text" autocomplete="off" required>
      <div class="err" id="e"></div>
      <button class="btn" style="width:100%;margin-top:6px" id="b">Masuk</button>
    </form>
    <button class="link" style="margin-top:26px;align-self:center" onclick="go('/admin')">Masuk sebagai admin</button>
  </main>`;
  $('#kode').focus();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const kode = $('#kode').value.trim(); const b = $('#b');
    b.disabled = true; b.textContent = 'Memeriksa…'; $('#e').textContent = '';
    try { await api('login', { kode }); store.set('po_kode', kode); route(); }
    catch(err){ $('#e').textContent = err.message === 'Kode akses salah' ? 'Kode akses salah. Periksa lagi lalu coba ulang.' : err.message; b.disabled=false; b.textContent='Masuk'; }
  };
}
function logout(){ store.del('po_kode'); go('/'); route(); }

/* ===== Home ===== */
async function viewHome(){
  app.innerHTML = `
  <div class="wrap">
    <div class="bar"><span class="brand">🍱 Pre-Order</span><button class="link" onclick="logout()">Keluar</button></div>
    <section class="hello">
      <h1>Mau pesan dari mana hari ini?</h1>
      <p>Toko di urutan atas sedang mendapat giliran. Setelah dipesan, toko pindah ke paling bawah.</p>
    </section>
    <ol class="queue" id="list"><li class="loading">Memuat daftar toko…</li></ol>
  </div>`;
  const load = async () => {
    try {
      const { stores } = await api('getStores');
      const list = $('#list'); if (!list) return;
      if (!stores.length){ list.innerHTML = `<li class="empty">Belum ada toko. Admin bisa menambahkannya dari halaman admin.</li>`; return; }
      let n = 0;
      list.innerHTML = stores.map(s => {
        const closed = !s.buka;
        if (!closed) n++;
        const lead = s.foto_url ? `<img src="${esc(s.foto_url)}" alt="">` : (closed ? '–' : n);
        const pills = [`<span class="pill ${closed?'closed':'open'}">${esc(s.info)}</span>`];
        if (!closed && s.lewatBatas) pills.push(`<span class="pill warn">Pre-order ditutup</span>`);
        return `<li><button class="store ${closed?'is-closed':''} ${!closed && n===1?'is-first':''}" ${closed?'disabled aria-disabled="true"':''} data-id="${esc(s.id)}">
          <span class="num" aria-hidden="true">${lead}</span>
          <span>${!closed && n===1?'<span class="turn">Giliran sekarang</span>':''}
            <h3>${esc(s.nama)}</h3>
            ${s.deskripsi?`<div class="meta">${esc(s.deskripsi)}</div>`:''}
            ${pills.join(' ')}
          </span></button></li>`;
      }).join('');
      list.querySelectorAll('.store:not([disabled])').forEach(b => b.onclick = () => go('/toko/' + encodeURIComponent(b.dataset.id)));
    } catch(err){
      if (err.message === 'Kode akses salah') return logout();
      const list = $('#list'); if (list) list.innerHTML = `<li class="empty">Daftar toko gagal dimuat: ${esc(err.message)}. Muat ulang halaman untuk mencoba lagi.</li>`;
    }
  };
  await load();
  refreshTimer = setInterval(load, 60000);
}

/* ===== Halaman toko ===== */
async function viewStore(id){
  app.innerHTML = `<div class="wrap"><button class="back" onclick="go('/')">‹ Daftar toko</button><div class="loading">Memuat menu…</div></div>`;
  let data;
  try { data = await api('getStore', { id }); }
  catch(err){
    if (err.message === 'Kode akses salah') return logout();
    toast(err.message === 'Toko sedang tutup' ? 'Toko ini sedang tutup.' : err.message);
    return go('/');
  }
  const { store: s, menus } = data;
  const qty = {};
  const canOrder = s.bisaPesan;
  app.innerHTML = `
  <div class="wrap">
    <button class="back" onclick="go('/')">‹ Daftar toko</button>
    <header class="store-head">
      <h1>${esc(s.nama)}</h1>
      ${s.deskripsi?`<p>${esc(s.deskripsi)}</p>`:''}
      <span class="pill open">${esc(s.info)}</span>
    </header>
    ${(s.batas_pesan||s.waktu_ambil)?`<div class="po">
      <div><small>Pesan paling lambat</small><b>${s.batas_pesan?esc(fmtWaktu(s.batas_pesan)):'Tidak dibatasi'}</b></div>
      <div><small>Waktu pengambilan</small><b>${s.waktu_ambil?esc(fmtWaktu(s.waktu_ambil)):'Menyusul'}</b></div>
    </div>`:'<div style="height:18px"></div>'}
    ${!canOrder?`<div class="notice">Batas waktu pre-order untuk toko ini sudah lewat. Menu masih bisa dilihat, tetapi pesanan baru tidak diterima.</div>`:''}
    <section class="menus" id="menus">
      ${menus.length ? menus.map(m => `
        <article class="menu ${m.tersedia?'':'out'}">
          <div class="ph">${m.foto_url?`<img src="${esc(m.foto_url)}" alt="${esc(m.nama)}" loading="lazy">`:'🍽️'}</div>
          <div class="body">
            <h4>${esc(m.nama)}</h4>
            ${m.deskripsi?`<div class="desc">${esc(m.deskripsi)}</div>`:''}
            <div class="row">
              <span class="price">${rp(m.harga)}</span>
              ${!m.tersedia ? '<span class="pill closed">Habis</span>' : canOrder ? `
              <span class="stepper" data-id="${esc(m.id)}">
                <button type="button" class="minus" aria-label="Kurangi ${esc(m.nama)}">−</button>
                <span aria-live="polite">0</span>
                <button type="button" class="plus" aria-label="Tambah ${esc(m.nama)}">+</button>
              </span>` : ''}
            </div>
          </div>
        </article>`).join('') : `<div class="empty">Toko ini belum punya menu.</div>`}
    </section>
    ${canOrder && menus.length ? `
    <form class="order-form" id="of">
      <h2>Data pemesan</h2>
      <label for="nama">Nama</label>
      <input id="nama" type="text" required autocomplete="name" value="${esc(store.get('po_nama')||'')}">
      <label for="cat">Catatan tambahan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <textarea id="cat" placeholder="Contoh: tidak pedas, sambal dipisah"></textarea>
      <div class="err" id="oe"></div>
    </form>` : ''}
  </div>
  ${canOrder && menus.length ? `
  <div class="cartbar"><div class="in">
    <div><small id="cnt">Belum ada menu dipilih</small><b id="tot">${rp(0)}</b></div>
    <button class="btn" id="send" disabled>Kirim pesanan</button>
  </div></div>` : ''}`;

  if (!canOrder || !menus.length) return;
  const priceOf = Object.fromEntries(menus.map(m => [m.id, m.harga]));
  const update = () => {
    let n = 0, t = 0;
    for (const [k,v] of Object.entries(qty)){ n += v; t += v * priceOf[k]; }
    $('#cnt').textContent = n ? `${n} porsi dipilih` : 'Belum ada menu dipilih';
    $('#tot').textContent = rp(t);
    $('#send').disabled = !n;
  };
  document.querySelectorAll('.stepper').forEach(st => {
    const id = st.dataset.id, out = st.querySelector('span');
    st.querySelector('.plus').onclick = () => { qty[id] = (qty[id]||0) + 1; out.textContent = qty[id]; update(); };
    st.querySelector('.minus').onclick = () => { qty[id] = Math.max(0,(qty[id]||0) - 1); out.textContent = qty[id]; update(); };
  });
  $('#send').onclick = async () => {
    const nama = $('#nama').value.trim();
    if (!nama){ $('#oe').textContent = 'Isi nama dulu supaya pesanan bisa dikenali.'; $('#nama').focus(); return; }
    const items = Object.entries(qty).filter(([,v])=>v>0).map(([id,q])=>({ id, qty:q }));
    const b = $('#send'); b.disabled = true; b.textContent = 'Mengirim…'; $('#oe').textContent = '';
    try {
      const res = await api('placeOrder', { id_toko: s.id, nama, catatan: $('#cat').value.trim(), items });
      store.set('po_nama', nama);
      viewDone(s, res, nama);
    } catch(err){
      $('#oe').textContent = err.message; b.disabled = false; b.textContent = 'Kirim pesanan';
      $('#oe').scrollIntoView({ block:'center' });
    }
  };
}

function viewDone(s, res, nama){
  window.scrollTo(0,0);
  app.innerHTML = `
  <div class="wrap">
    <section class="done">
      <div class="tick" aria-hidden="true">✓</div>
      <h1 style="margin:0 0 6px;letter-spacing:-.02em">Pesanan terkirim</h1>
      <p style="color:var(--muted);margin:0">Terima kasih, ${esc(nama)}. ${esc(s.nama)} sekarang pindah ke urutan paling bawah.</p>
      <div class="receipt">
        <div class="line"><span>No. pesanan</span><b>${esc(res.id)}</b></div>
        ${res.waktu_ambil?`<div class="line"><span>Ambil</span><b>${esc(fmtWaktu(res.waktu_ambil))}</b></div>`:''}
        <div style="height:8px"></div>
        ${res.items.map(i=>`<div class="line"><span>${i.qty}× ${esc(i.nama)}</span><span>${rp(i.qty*i.harga)}</span></div>`).join('')}
        <div class="line tot"><span>Total</span><span>${rp(res.total)}</span></div>
      </div>
      <button class="btn" onclick="go('/');route()">Kembali ke daftar toko</button>
    </section>
  </div>`;
}

let A = { stores:[], menus:[], orders:[], tab:'pesanan', filterToko:'' };

function adminLogout(){ sess.del('po_admin'); viewAdmin(); }

async function loadAdmin(){
  try {
    const d = await api('adminData');
    A.stores = d.stores; A.menus = d.menus; A.orders = d.orders;
    renderAdmin();
  } catch(err){
    if (err.message === 'Kode admin salah') return adminLogout();
    $('#panel').innerHTML = `<div class="empty">Data gagal dimuat: ${esc(err.message)}</div>`;
  }
}
const storeName = id => (A.stores.find(s=>s.id===id)||{}).nama || '(toko dihapus)';

function renderAdmin(){
  document.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.t===A.tab); b.setAttribute('aria-selected', b.dataset.t===A.tab); });
  const p = $('#panel');
  if (A.tab === 'toko'){
    p.innerHTML = `
    <div class="panel-head"><h2>Toko</h2><button class="btn small" onclick="editStore()">Tambah toko</button></div>
    <div class="alist">${A.stores.length ? A.stores.map(s => `
      <div class="aitem">
        <div class="th">${s.foto_url?`<img src="${esc(s.foto_url)}" alt="">`:'🏪'}</div>
        <div class="grow"><h4>${esc(s.nama)}</h4>
          <div class="meta">${esc(s.status_info)} · Mode: ${esc(s.mode||'Otomatis')}</div>
          <div class="meta">${A.menus.filter(m=>m.id_toko===s.id).length} menu${s.batas_pesan?` · Batas pesan ${esc(fmtWaktu(s.batas_pesan))}`:''}</div></div>
        <div class="acts"><button class="btn small ghost" onclick="editStore('${esc(s.id)}')">Ubah</button></div>
      </div>`).join('') : `<div class="empty">Belum ada toko. Tambahkan toko pertama untuk mulai.</div>`}</div>`;
  } else if (A.tab === 'menu'){
    const f = A.filterToko;
    const list = A.menus.filter(m => !f || m.id_toko===f).sort((a,b)=> storeName(a.id_toko).localeCompare(storeName(b.id_toko)) || (Number(a.urutan)||0)-(Number(b.urutan)||0));
    p.innerHTML = `
    <div class="panel-head"><h2>Menu</h2><button class="btn small" onclick="editMenu()" ${A.stores.length?'':'disabled'}>Tambah menu</button></div>
    <div class="filters"><select id="ft" aria-label="Filter toko"><option value="">Semua toko</option>${A.stores.map(s=>`<option value="${esc(s.id)}" ${f===s.id?'selected':''}>${esc(s.nama)}</option>`).join('')}</select></div>
    <div class="alist">${list.length ? list.map(m => `
      <div class="aitem">
        <div class="th">${m.foto_url?`<img src="${esc(m.foto_url)}" alt="">`:'🍽️'}</div>
        <div class="grow"><h4>${esc(m.nama)}</h4>
          <div class="meta">${esc(storeName(m.id_toko))} · ${rp(m.harga)}${m.tersedia==='FALSE'?' · <b style="color:var(--sambal)">Habis</b>':''}</div></div>
        <div class="acts"><button class="btn small ghost" onclick="editMenu('${esc(m.id)}')">Ubah</button></div>
      </div>`).join('') : `<div class="empty">${A.stores.length?'Belum ada menu. Tambahkan menu untuk toko Anda.':'Tambahkan toko dulu sebelum menambah menu.'}</div>`}</div>`;
    $('#ft').onchange = e => { A.filterToko = e.target.value; renderAdmin(); };
  } else {
    const f = A.filterToko;
    const list = A.orders.filter(o => !f || o.id_toko===f);
    const totalBaru = list.filter(o=>o.status!=='Selesai').reduce((a,o)=>a+(Number(o.total)||0),0);
    p.innerHTML = `
    <div class="panel-head"><h2>Pesanan</h2><button class="btn small ghost" onclick="loadAdmin()">Muat ulang</button></div>
    <div class="filters"><select id="ft" aria-label="Filter toko"><option value="">Semua toko</option>${A.stores.map(s=>`<option value="${esc(s.id)}" ${f===s.id?'selected':''}>${esc(s.nama)}</option>`).join('')}</select></div>
    <p class="hint" style="margin:0 0 12px">${list.filter(o=>o.status!=='Selesai').length} pesanan belum selesai, total ${rp(totalBaru)}</p>
    <div class="alist">${list.length ? list.map(o => `
      <div class="order ${o.status==='Selesai'?'selesai':''}">
        <div class="top"><b>${esc(o.nama_pemesan)}</b><span class="when">${esc(fmtWaktu(o.waktu))}</span></div>
        <div class="meta" style="color:var(--muted);font-size:.85rem">${esc(o.nama_toko)} · ${esc(o.id)}</div>
        <div class="items">${esc(o.ringkasan)}</div>
        ${o.catatan?`<div class="note">${esc(o.catatan)}</div>`:''}
        <div class="bottom"><b>${rp(o.total)}</b>
          <button class="btn small ${o.status==='Selesai'?'ghost':''}" onclick="toggleOrder('${esc(o.id)}')">${o.status==='Selesai'?'Tandai belum selesai':'Tandai selesai'}</button></div>
      </div>`).join('') : `<div class="empty">Belum ada pesanan masuk.</div>`}</div>`;
    $('#ft').onchange = e => { A.filterToko = e.target.value; renderAdmin(); };
  }
}

async function toggleOrder(id){
  const o = A.orders.find(x=>x.id===id); if (!o) return;
  const status = o.status === 'Selesai' ? 'Baru' : 'Selesai';
  try { await api('setOrderStatus', { id, status }); o.status = status; renderAdmin(); toast(status==='Selesai'?'Pesanan ditandai selesai':'Pesanan ditandai belum selesai'); }
  catch(err){ toast(err.message); }
}

/* --- unggah foto (dikompres di browser) --- */
function compressImage(file, max=1000){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => rej(new Error('File bukan gambar yang valid'));
    img.src = url;
  });
}
async function uploadFrom(input, preview, hidden){
  const file = input.files[0]; if (!file) return;
  preview.classList.remove('hidden'); preview.style.opacity = .4;
  try {
    const data = await compressImage(file);
    preview.src = 'data:image/jpeg;base64,' + data;
    const r = await api('uploadPhoto', { data, mimeType:'image/jpeg', name: file.name.replace(/\.[^.]+$/,'') + '.jpg' });
    hidden.value = r.url; preview.style.opacity = 1; toast('Foto terunggah');
  } catch(err){ preview.style.opacity = 1; toast('Foto gagal diunggah: ' + err.message); }
}

function openSheet(html){
  const d = document.createElement('div'); d.className = 'sheet';
  d.innerHTML = `<div class="box" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener('click', e => { if (e.target === d) d.remove(); });
  document.body.appendChild(d);
  return d;
}

function editStore(id){
  const s = A.stores.find(x=>x.id===id) || { mode:'Otomatis' };
  const d = openSheet(`
    <h2>${id?'Ubah toko':'Tambah toko'}</h2>
    <form id="sf">
      <label for="s_nama">Nama toko</label><input id="s_nama" type="text" required value="${esc(s.nama||'')}">
      <label for="s_desk">Deskripsi singkat</label><input id="s_desk" type="text" value="${esc(s.deskripsi||'')}" placeholder="Contoh: Nasi campur dan aneka lauk">
      <label>Foto atau logo toko <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <input id="s_file" type="file" accept="image/*">
      <img id="s_prev" class="foto-prev ${s.foto_url?'':'hidden'}" src="${esc(s.foto_url||'')}" alt="">
      <input id="s_foto" type="hidden" value="${esc(s.foto_url||'')}">

      <label for="s_mode">Status buka</label>
      <select id="s_mode">
        ${['Otomatis','Paksa Buka','Paksa Tutup'].map(m=>`<option ${s.mode===m?'selected':''}>${m}</option>`).join('')}
      </select>
      <p class="hint">Otomatis mengikuti jadwal di bawah (WIB). Paksa Buka/Tutup mengabaikan jadwal.</p>

      <label>Jadwal buka</label>
      <table class="sched"><tbody>
        ${HARI.map((h,i)=>{ const on = !!(s[h+'_buka']&&s[h+'_tutup']); return `
        <tr data-h="${h}"><td><label class="check" style="margin:0"><input type="checkbox" class="on" ${on||!id?'checked':''}> ${NAMA_HARI[i]}</label></td>
          <td><input type="time" class="b" value="${esc(s[h+'_buka']|| (id?'':'08:00'))}" aria-label="Jam buka ${NAMA_HARI[i]}"></td>
          <td><input type="time" class="t" value="${esc(s[h+'_tutup']|| (id?'':'17:00'))}" aria-label="Jam tutup ${NAMA_HARI[i]}"></td></tr>`; }).join('')}
      </tbody></table>
      <p class="hint">Hilangkan centang untuk hari libur.</p>

      <label for="s_batas">Batas waktu pemesanan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <input id="s_batas" type="datetime-local" value="${esc((s.batas_pesan||'').slice(0,16))}">
      <label for="s_ambil">Waktu pengambilan <span style="font-weight:400;color:var(--muted)">(opsional)</span></label>
      <input id="s_ambil" type="datetime-local" value="${esc((s.waktu_ambil||'').slice(0,16))}">
      <div class="err" id="se"></div>
      <div class="actions">
        ${id?`<button type="button" class="btn danger" id="s_del">Hapus toko</button>`:''}
        <button type="button" class="btn ghost" id="s_cancel">Batal</button>
        <button class="btn" id="s_save">Simpan toko</button>
      </div>
    </form>`);
  const syncRow = tr => { const on = tr.querySelector('.on').checked; tr.querySelectorAll('input[type=time]').forEach(i=>i.disabled=!on); };
  d.querySelectorAll('.sched tr').forEach(tr => { syncRow(tr); tr.querySelector('.on').onchange = () => syncRow(tr); });
  $('#s_file', d).onchange = e => uploadFrom(e.target, $('#s_prev', d), $('#s_foto', d));
  $('#s_cancel', d).onclick = () => d.remove();
  if (id) $('#s_del', d).onclick = async () => {
    if (!confirm(`Hapus toko "${s.nama}" beserta semua menunya? Riwayat pesanan tetap tersimpan.`)) return;
    try { await api('deleteStore', { id }); d.remove(); toast('Toko dihapus'); loadAdmin(); } catch(err){ $('#se', d).textContent = err.message; }
  };
  $('#sf', d).onsubmit = async e => {
    e.preventDefault();
    const o = { id: id||'', nama: $('#s_nama',d).value.trim(), deskripsi: $('#s_desk',d).value.trim(), foto_url: $('#s_foto',d).value,
      mode: $('#s_mode',d).value, batas_pesan: $('#s_batas',d).value, waktu_ambil: $('#s_ambil',d).value };
    let bad = '';
    d.querySelectorAll('.sched tr').forEach(tr => {
      const h = tr.dataset.h, on = tr.querySelector('.on').checked, b = tr.querySelector('.b').value, t = tr.querySelector('.t').value;
      o[h+'_buka'] = on ? b : ''; o[h+'_tutup'] = on ? t : '';
      if (on && (!b || !t || t <= b)) bad = `Jam tutup hari ${NAMA_HARI[HARI.indexOf(h)]} harus setelah jam buka.`;
    });
    if (bad){ $('#se',d).textContent = bad; return; }
    const btn = $('#s_save', d); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try { await api('saveStore', { store:o }); d.remove(); toast('Toko disimpan'); loadAdmin(); }
    catch(err){ $('#se',d).textContent = err.message; btn.disabled=false; btn.textContent='Simpan toko'; }
  };
}

function editMenu(id){
  const m = A.menus.find(x=>x.id===id) || { id_toko: A.filterToko || (A.stores[0]||{}).id, tersedia:'TRUE' };
  const d = openSheet(`
    <h2>${id?'Ubah menu':'Tambah menu'}</h2>
    <form id="mf">
      <label for="m_toko">Toko</label>
      <select id="m_toko">${A.stores.map(s=>`<option value="${esc(s.id)}" ${m.id_toko===s.id?'selected':''}>${esc(s.nama)}</option>`).join('')}</select>
      <label for="m_nama">Nama menu</label><input id="m_nama" type="text" required value="${esc(m.nama||'')}">
      <label for="m_harga">Harga (Rp)</label><input id="m_harga" type="number" min="0" step="500" required value="${esc(m.harga??'')}">
      <label for="m_desk">Deskripsi</label><textarea id="m_desk" placeholder="Contoh: Nasi, ayam goreng, sambal, lalapan">${esc(m.deskripsi||'')}</textarea>
      <label>Foto menu</label>
      <input id="m_file" type="file" accept="image/*">
      <img id="m_prev" class="foto-prev ${m.foto_url?'':'hidden'}" src="${esc(m.foto_url||'')}" alt="">
      <input id="m_foto" type="hidden" value="${esc(m.foto_url||'')}">
      <label for="m_urut">Urutan tampil</label><input id="m_urut" type="number" value="${esc(m.urutan||'')}" placeholder="1, 2, 3…">

        ${id?`<button type="button" class="btn danger" id="m_del">Hapus menu</button>`:''}
        <button type="button" class="btn ghost" id="m_cancel">Batal</button>
        <button class="btn" id="m_save">Simpan menu</button>
      </div>
    </form>`);
  $('#m_file', d).onchange = e => uploadFrom(e.target, $('#m_prev', d), $('#m_foto', d));
  $('#m_cancel', d).onclick = () => d.remove();
  if (id) $('#m_del', d).onclick = async () => {
    if (!confirm(`Hapus menu "${m.nama}"?`)) return;
    try { await api('deleteMenu', { id }); d.remove(); toast('Menu dihapus'); loadAdmin(); } catch(err){ $('#me', d).textContent = err.message; }
  };
  $('#mf', d).onsubmit = async e => {
    e.preventDefault();
    const o = { id: id||'', id_toko: $('#m_toko',d).value, nama: $('#m_nama',d).value.trim(), harga: $('#m_harga',d).value,
      deskripsi: $('#m_desk',d).value.trim(), foto_url: $('#m_foto',d).value, urutan: $('#m_urut',d).value, tersedia: $('#m_ada',d).checked ? 'TRUE':'FALSE' };
    const btn = $('#m_save', d); btn.disabled = true; btn.textContent = 'Menyimpan…';
    try { await api('saveMenu', { menu:o }); d.remove(); toast('Menu disimpan'); loadAdmin(); }
    catch(err){ $('#me',d).textContent = err.message; btn.disabled=false; btn.textContent='Simpan menu'; }
  };
}

route();
